name: Build Windows installer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      # Same steps as build_windows.bat, inlined so Inno Setup is guaranteed present.
      # CI=true (set by GitHub) makes CMakeLists.txt skip COPY_PLUGIN_AFTER_BUILD.
      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Check build output
        run: |
          foreach ($p in "build/AccentFX_artefacts/Release/VST3/Accent FX.vst3", "build/AccentFX_artefacts/Release/Standalone/Accent FX.exe") {
            if (-not (Test-Path $p)) { throw "Missing build output: $p" }
          }
        shell: pwsh

      - name: Install Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
        shell: pwsh

      - name: Build installer
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\AccentFX.iss'
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: AccentFX-Setup
          path: dist/AccentFX-Setup.exe
          if-no-files-found: error
